name: Upstream Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Pull upstream changes
        run: |
          git remote add upstream https://github.com/apistech/project.git
          git fetch upstream
          git checkout main || git checkout master
          git merge upstream/main --allow-unrelated-histories -m "Sync upstream changes" || git merge upstream/master --allow-unrelated-histories -m "Sync upstream changes"
          git push origin main || git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
