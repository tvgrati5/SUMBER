name: Upstream Sync

on:
  schedule:
    - cron: "0 */6 * * *" # Berjalan otomatis setiap 6 jam sekali
  workflow_dispatch: # Memungkinkan Anda menjalankan sinkronisasi secara manual

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync with upstream repository
        uses: dabreadman/sync-upstream-repo@v1.3.0
        with:
          upstream_repo: "https://github.com/apistech/project.git"
          upstream_branch: "main"
          branch: "main"
          token: ${{ secrets.GITHUB_TOKEN }}
